name: Publish release downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.5.0)
        required: true
        default: v0.5.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Studio, examples and online game
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag must match package.json version ($expected_tag)."
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run package:studio -- --platform win32
      - run: npm run package:examples
      - run: npm run package:game -- --project examples/neon-borough/project.openengine --platform win32
      - run: npm run package:game -- --project examples/neon-borough/project.openengine --platform web
      - name: Create downloadable ZIPs and checksums
        run: |
          (cd release/OpenEngineStudio-win32-x64 && zip -q -r ../OpenEngineStudio-Windows.zip .)
          (cd release && zip -q -r NeonBorough-Windows.zip NeonBorough-win32-x64 NeonBoroughServer-win32-x64)
          cd release
          sha256sum OpenEngineStudio-Windows.zip Example.Projects.zip NeonBorough-Windows.zip NeonBorough-web.zip NeonBorough-source.zip > SHA256SUMS.txt
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "OpenEngine $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" \
            release/OpenEngineStudio-Windows.zip \
            release/Example.Projects.zip \
            release/NeonBorough-Windows.zip \
            release/NeonBorough-web.zip \
            release/NeonBorough-source.zip \
            release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
